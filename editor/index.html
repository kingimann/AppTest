<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#191919">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Pocket Editor</title>
<link rel="icon" href="../icon.svg" type="image/svg+xml">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="apple-touch-icon" href="../icon.svg">
<link rel="stylesheet" href="editor.css">
</head>
<body>
<div id="app">
  <header id="toolbar">
    <button id="fileBtn" class="tb" title="Menu"></button>
    <div id="projectTitle"></div>
    <div class="tb-group">
      <button class="tb" id="saveBtn" title="Save (Ctrl S)" hidden></button>
      <button class="tb" id="undoBtn" title="Undo"></button>
      <button class="tb" id="redoBtn" title="Redo"></button>
    </div>
    <div class="tb-group" id="playGroup">
      <button class="tb" id="playBtn" title="Play"></button>
      <button class="tb" id="pauseBtn" title="Pause" disabled></button>
    </div>
  </header>

  <section id="scenePanel" class="panel">
    <div class="panel-tabs">
      <div class="ptab active" id="sceneTab"></div>
      <button class="level-btn" id="levelBtn" title="Levels"></button>
      <button class="pt-btn ui-toggle" id="uiBtn" title="Edit the on-screen UI">UI</button>
      <button class="pt-btn" id="phoneBtn" title="Native preview: try the app (Flutter · Kotlin · SwiftUI) right here in the scene view"></button>
      <span class="sp"></span>
      <button class="pt-btn" id="snapBtn" title="Snap to grid"></button>
      <button class="pt-btn" id="gridBtn" title="Show grid"></button>
      <button class="pt-btn" id="frameBtn" title="Frame selected (F)"></button>
    </div>
    <div id="viewport">
      <div id="toolRail">
        <button data-tool="hand" title="Hand: pan the view"></button>
        <button data-tool="move" title="Move"></button>
        <button data-tool="rotate" title="Rotate"></button>
        <button data-tool="scale" title="Scale"></button>
        <button data-tool="rect" title="Rect: drag edges and corners to resize UI and 2D objects"></button>
        <button data-tool="paint" title="Paint: tap or drag to place copies of the selected object"></button>
      </div>
      <div id="zoomBar">
        <button data-zoom="out" title="Zoom out"></button>
        <button data-zoom="in" title="Zoom in"></button>
        <button data-zoom="reset" title="Reset view"></button>
      </div>
      <button id="panelsFab" title="Show panels"></button>
      <button id="addFab" title="Add objects and components"></button>
      <div id="hint" hidden></div>
      <div id="attachBar" hidden><span></span><button>Cancel</button></div>
      <div id="ctxBar" hidden>
        <button data-act="inspect"></button>
        <button data-act="duplicate"></button>
        <button data-act="focus"></button>
        <button data-act="attach"></button>
        <button data-act="detach"></button>
        <button data-act="delete"></button>
      </div>
    </div>
  </section>

  <section id="sheet">
  <div id="sheetHandle"><span></span></div>
  <nav id="dockTabs">
    <button data-dock="scene" class="active"></button>
    <button data-dock="hierarchy"></button>
    <button data-dock="inspector"></button>
    <button data-dock="scripts"></button>
    <button data-dock="project"></button>
    <button data-dock="console"></button>
  </nav>

  <section id="hierarchyPanel" class="panel dock active" data-dock="hierarchy">
    <div class="panel-tabs desk"><div class="ptab active" data-title="hierarchy"></div></div>
    <div class="panel-body" id="hierarchy"></div>
  </section>
  <section id="inspectorPanel" class="panel dock" data-dock="inspector">
    <div class="panel-tabs desk"><div class="ptab active" data-title="inspector"></div></div>
    <div class="panel-body" id="inspector"></div>
  </section>
  <section id="scriptsPanel" class="panel dock" data-dock="scripts">
    <div class="panel-tabs desk"><div class="ptab active" data-title="scripts"></div></div>
    <div class="panel-body" id="scripts"></div>
  </section>
  <section id="projectPanel" class="panel dock" data-dock="project">
    <div class="panel-tabs desk"><div class="ptab active" data-title="project"></div></div>
    <div class="panel-body" id="project"></div>
  </section>
  <section id="consolePanel" class="panel dock" data-dock="console">
    <div class="panel-tabs desk"><div class="ptab active" data-title="console"></div></div>
    <div class="panel-body" id="console"></div>
  </section>
  </section>
</div>

<div id="playBar" hidden>
  <button id="pbPlay" class="tb on" title="Stop"></button>
  <button id="pbPause" class="tb" title="Pause"></button>
  <button id="pbStep" class="tb" title="Step one frame"></button>
  <button id="pbInspect" class="tb" title="Inspect: pause and tap an object"></button>
  <button id="pbStats" class="tb" title="Stats"></button>
  <button id="pbShot" class="tb" title="Screenshot for the store listing"></button>
  <button id="pbPreview" class="tb" title="Preview: standalone, phone window or on a phone"></button>
  <button id="pbLog" class="tb" title="Console"></button>
  <button id="pbDock" class="tb" title="Where this bar goes"></button>
  <button id="pbHandle" class="tb" title="Play tools"></button>
</div>
<div id="playStats" hidden></div>
<div id="playInspect" hidden></div>
<div id="playConsole" hidden></div>
<div id="home" hidden data-pull-refresh></div>
<div id="menuLayer" hidden></div>
<div id="dragGhost" hidden></div>
<input type="file" id="fileInput" hidden>
<script>
// If the editor fails to start (usually old and new files mixed in the browser cache right after an update),
// re-download its files and reload once; if that still fails, show a message with a button.
(function () {
  var FILES = ['editor.js', 'editor.css', 'icons.js', 'navstyles.js', 'storage.js', 'library.js', 'logic.js', 'items.js', 'story.js', 'data.js', 'meshops.js', 'modeler.js', 'sprite2d.js', 'nodes.js', 'timeline.js', 'loading.js', 'stores.js', 'expo.js', '../engine/pocket.js', '../examples/templates.js'];
  function fresh() {
    try { sessionStorage.setItem('pocket.boot', String(Date.now())); } catch (e) {}
    var sw = navigator.serviceWorker ? navigator.serviceWorker.getRegistration().then(function (r) { return r && r.update(); }).catch(function () {}) : Promise.resolve();
    sw.then(function () {
      // re-download every file, replacing whatever the browser cached, then start again
      return Promise.all(FILES.map(function (f) { return fetch(f, { cache: 'reload' }).catch(function () {}); }));
    }).then(function () { location.reload(); });
  }
  addEventListener('load', function () { setTimeout(check, 2500); });
  function check() {
    if (window.pocketReady) return;
    var last = 0; try { last = +sessionStorage.getItem('pocket.boot') || 0; } catch (e) {}
    if (Date.now() - last > 60000) return fresh();
    var d = document.createElement('div');
    d.style.cssText = 'position:fixed;inset:0;z-index:999;background:#232323;color:#dedede;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center;font:17px -apple-system,sans-serif';
    d.innerHTML = '<b style="font-size:20px">The editor could not start</b><span style="color:#a3a3a3">Your projects are safe. Try loading it again.</span>';
    var b = document.createElement('button'); b.textContent = 'Reload';
    b.style.cssText = 'height:52px;padding:0 28px;border:0;border-radius:12px;background:#3a6ea5;color:#fff;font:600 17px -apple-system,sans-serif';
    b.onclick = fresh; d.appendChild(b); document.body.appendChild(d);
  }
})();
</script>
<script src="../update.js"></script>
<script type="module" src="editor.js"></script>
</body>
</html>
