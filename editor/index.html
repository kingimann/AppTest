<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#14141f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Pocket Editor</title>
<link rel="icon" href="../icon.svg" type="image/svg+xml">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="stylesheet" href="editor.css">
</head>
<body>
<div id="app">
  <header id="topbar">
    <button id="menuBtn" class="icon" aria-label="Menu">☰</button>
    <div id="projectName" class="title">Untitled</div>
    <button id="undoBtn" class="icon" aria-label="Undo">↶</button>
    <button id="redoBtn" class="icon" aria-label="Redo">↷</button>
    <button id="snapBtn" class="icon toggle on" aria-label="Snap to grid">#</button>
    <button id="playBtn" class="play" aria-label="Play">▶ Play</button>
  </header>

  <main id="viewport">
    <div id="hint" class="hint" hidden>Tap <b>+</b> to add objects · drag to move · pinch to zoom</div>
    <button id="addBtn" class="fab" aria-label="Add object">+</button>
  </main>

  <section id="panel" class="half">
    <div id="panelHandle"><span></span></div>
    <nav id="tabs">
      <button data-tab="objects" class="active">Objects</button>
      <button data-tab="inspector">Inspector</button>
      <button data-tab="scene">Game</button>
    </nav>
    <div id="panelBody">
      <div id="tab-objects" class="tab active"></div>
      <div id="tab-inspector" class="tab"></div>
      <div id="tab-scene" class="tab"></div>
    </div>
  </section>
</div>

<button id="stopBtn" hidden>■ Stop</button>

<div id="sheet" class="sheet" hidden>
  <div class="sheet-card">
    <div class="sheet-head"><h3 id="sheetTitle"></h3><button class="icon" data-close>✕</button></div>
    <div id="sheetBody"></div>
  </div>
</div>

<input type="file" id="fileInput" hidden>
<script type="module" src="editor.js"></script>
</body>
</html>
