<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0b1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Pocket Player</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>html,body{margin:0;height:100%;background:#0b0b1a;overflow:hidden;overscroll-behavior:none}</style>
</head>
<body>
<script type="module">
  // play.html?game=<template key>  or  play.html?src=<url to scene JSON>
  import { Engine, jsonPatch } from './engine/pocket.js';
  import { templates } from './examples/templates.js';
  const q = new URLSearchParams(location.search);
  let json = templates[q.get('game') || 'sky-dodge'];
  if (q.get('src')) json = await (await fetch(q.get('src'))).json();
  const unpack = async (b64) => { const b = b64.replace(/-/g, '+').replace(/_/g, '/'), bin = atob(b + '==='.slice((b.length + 3) % 4)), u = Uint8Array.from(bin, (c) => c.charCodeAt(0)); return JSON.parse(await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'))).text()); };
  if (q.get('preview')) { // Standalone Preview from the editor (same browser): the project waits in storage, and a newer one reloads this tab
    try { const pv = JSON.parse(localStorage.getItem('pocket.preview') || 'null'); if (pv?.game) { json = pv.game; window.__previewAt = pv.at; } } catch { /* storage unavailable */ }
    addEventListener('storage', (ev) => { if (ev.key === 'pocket.preview') location.reload(); });
  }
  const H = new URLSearchParams(location.hash.slice(1));
  if (H.get('t') && H.has('d')) { // Device Preview: a template plus the changes made to it
    try { const base = templates[H.get('t')]; if (!base) throw new Error('unknown template'); json = jsonPatch(JSON.parse(JSON.stringify(base)), await unpack(H.get('d'))); }
    catch (err) { document.body.innerHTML = '<p style="color:#fff;font:16px system-ui;padding:24px">This preview link could not be opened. Make a new one in the editor.</p>'; throw err; }
  }
  if (location.hash.startsWith('#p=')) { // a test link from the editor: the game is packed (gzip, base64url) into the link
    try { const b = location.hash.slice(3).replace(/-/g, '+').replace(/_/g, '/'), bin = atob(b + '==='.slice((b.length + 3) % 4)), u = Uint8Array.from(bin, (c) => c.charCodeAt(0));
      json = JSON.parse(await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'))).text()); }
    catch (err) { document.body.innerHTML = '<p style="color:#fff;font:16px system-ui;padding:24px">This test link could not be opened. Copy it again from the editor.</p>'; throw err; }
  }
  document.title = json.name;
  window.POCKET_STORE_TEST = true; // the test player: in-app purchases use a test sheet
  window.engine = new Engine();
  window.engine.start(json);
</script>
<script src="update.js"></script>
<script>if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});</script>
</body>
</html>
